<div class="header">
  <h2 class="titulo">Categoria de Equipamentos</h2>

  <div class="header-actions">
    <app-pesquisa
      placeholder="Pesquisar..."
      [valor]="termoPesquisa"
      (pesquisou)="pesquisar($event)">
    </app-pesquisa>

    <app-botao
      [texto]="mostrarInativas ? 'Apenas ativas' : 'Mostrar inativas'"
        icone="visibility"
        cor="primary" 
      (clicou)="toggleInativas()">
    </app-botao>
  </div>
</div>

<app-tabela
  [colunas]="colunas"
  [dados]="categoriasFiltradas"
  (linhaSelecionada)="selecionarLinha($event)">
</app-tabela>

<app-paginacao
  [totalElements]="totalElements"
  [itensPorPagina]="itensPorPagina"
  [number]="paginaAtual"
  [totalPaginas]="totalPaginas"
  (paginaChange)="selecionarPagina($event)">
</app-paginacao>

<div class="container-botoes">
  <app-botao
    texto="Adicionar"
    icone="add"
    cor="primary"
    (clicou)="adicionar()">
  </app-botao>

  <app-botao
    texto="Atualizar"
    icone="edit"
    cor="accent"
    (clicou)="atualizar()" 
    [desabilitado]="!categoriaSelecionada">
  </app-botao>

  <app-botao
    texto="Desativar"
    icone="delete"
    cor="warn"
    (clicou)="excluir()"
    [desabilitado]="!categoriaSelecionada || mostrarInativas">
    Desativar
  </app-botao>

  @if (mostrarInativas) {
    <app-botao
        texto="Reativar"
        (clicou)="reativar()"
        [desabilitado]="!categoriaSelecionada">
    </app-botao>
  }

</div>
