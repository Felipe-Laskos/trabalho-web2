<div class="page-padding">
  
  <section class="boas-vindas">
    <h1>Olá, {{ nomeUsuario }}!</h1>
    

  </section>

  <app-card-visualizacao>
    
    <div class="toolbar-home-custom">
      <div class="wrapper-busca-custom">
        <app-input 
          titulo="Busca"
          placeholder="O que você está procurando?" 
          largura="100%"
          (mudou)="onBusca($event)">
        </app-input>
      </div>

      <app-botao-aprovar (clicou)="irParaSolicitacao()">
        <div class="conteudo-botao">
          <mat-icon>add</mat-icon> 
          <span>Solicitar Manutenção</span>
        </div>
      </app-botao-aprovar>
    </div>

    <div class="area-solicitacoes">
      <div class="estado-carregamento" *ngIf="carregamento">
        <mat-icon>autorenew</mat-icon>
        <p>Carregando solicitações...</p>
      </div>

      <app-tabela
        *ngIf="!carregamento"
        [dados]="dadosExibidos"
        [colunas]="colunasTabela"
        [acoes]="acoesTabela"
        (acaoClicada)="aoClicarAcaoTabela($event)">
      </app-tabela>
    </div>

    <ng-container *ngIf="!carregamento">

    <div class="sem-dados" *ngIf="dadosFiltrados.length === 0">
      <mat-icon>info</mat-icon>
      <p>Nenhuma solicitação encontrada.</p>
    </div>

    <div class="footer-custom-paginacao" *ngIf="dadosFiltrados.length > 0">
      <app-paginacao 
        [totalElements]="totalElements"
        [itensPorPagina]="itensPorPagina" 
        [number]="paginaAtual"
        [totalPaginas]="totalPaginas"
        (paginaChange)="aoMudarPagina($event)">
      </app-paginacao>
    </div>
    </ng-container>
  </app-card-visualizacao>
</div>
